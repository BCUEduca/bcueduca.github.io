<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Bolsa de Valores — Dinámica de Educación Financiera</title>
<style>
  :root{
    --bg:#0a0e17; --bg2:#0f1524; --panel:#141b2e; --panel2:#1a2340;
    --line:#243052; --txt:#e8edf7; --dim:#8b96b3; --faint:#5a6480;
    --up:#22e07c; --up-dim:rgba(34,224,124,.12);
    --down:#ff5d5d; --down-dim:rgba(255,93,93,.12);
    --gold:#f5c542; --blue:#4da3ff; --violet:#9b7bff;
    --mono:'Consolas','Roboto Mono',monospace;
    --sans:'Segoe UI',system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--txt);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer;border:none}
  input,select{font-family:inherit}
  .hidden{display:none !important}
  .mono{font-family:var(--mono)}
  .up{color:var(--up)} .down{color:var(--down)} .gold{color:var(--gold)}

  /* ---------- generic UI ---------- */
  .btn{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:10px;
       padding:12px 20px;font-size:16px;font-weight:600;transition:filter .15s, transform .05s}
  .btn:active{transform:scale(.98)}
  .btn:hover{filter:brightness(1.2)}
  .btn-primary{background:linear-gradient(135deg,#1d6fd1,#4da3ff);border:none;color:#fff}
  .btn-gold{background:linear-gradient(135deg,#c99a1e,#f5c542);border:none;color:#1a1400}
  .btn-danger{background:linear-gradient(135deg,#a03030,#ff5d5d);border:none;color:#fff}
  .btn-ghost{background:transparent;border:1px dashed var(--line);color:var(--dim)}
  .btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
  .btn-big{font-size:19px;padding:16px 26px;border-radius:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}
  .input{background:var(--bg2);border:1px solid var(--line);border-radius:10px;color:var(--txt);
         padding:12px 14px;font-size:17px;width:100%}
  .input:focus{outline:2px solid var(--blue);border-color:transparent}
  .tag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.4px}
  .tag-bond{background:rgba(77,163,255,.15);color:var(--blue)}
  .tag-fund{background:rgba(155,123,255,.15);color:var(--violet)}
  .tag-stock{background:rgba(245,197,66,.15);color:var(--gold)}
  .chg{font-family:var(--mono);font-weight:700}
  .chg.up::before{content:"▲ "} .chg.down::before{content:"▼ "}
  .chg.flat{color:var(--dim)} .chg.flat::before{content:"— "}

  /* ---------- home ---------- */
  #view-home{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
             padding:32px;gap:14px;text-align:center;
             background:radial-gradient(1200px 600px at 50% -10%, #16234a 0%, var(--bg) 60%)}
  #view-home h1{font-size:clamp(30px,5vw,52px);letter-spacing:1px}
  .ingot{height:1em;width:auto;vertical-align:-.12em;display:inline-block;
         filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
  #view-home h1 .tick{color:var(--gold)}
  #view-home h1 .ingot{height:.92em;vertical-align:-.08em}
  #view-home .sub{color:var(--dim);font-size:17px;max-width:560px;margin-bottom:18px}
  .role-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;width:100%;max-width:860px}
  .role-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px 20px;
             display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--txt);
             transition:transform .15s, border-color .15s}
  .role-card:hover{transform:translateY(-4px);border-color:var(--blue)}
  .role-card .ico{font-size:42px}
  .role-card b{font-size:19px}
  .role-card span{color:var(--dim);font-size:14px;line-height:1.4}
  .conn-note{color:var(--faint);font-size:13px;margin-top:20px}

  /* ---------- top bars ---------- */
  .topbar{display:flex;align-items:center;gap:14px;padding:12px 18px;background:var(--bg2);
          border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  .topbar .brand{font-weight:800;letter-spacing:1px;font-size:15px;white-space:nowrap}
  .topbar .brand .tick{color:var(--gold)}
  .round-pill{background:var(--panel2);border:1px solid var(--line);border-radius:999px;
              padding:6px 16px;font-weight:700;font-size:14px;white-space:nowrap}
  .round-pill .n{color:var(--gold)}
  .conn-pill{margin-left:auto;font-size:12px;color:var(--dim);display:flex;align-items:center;gap:6px;white-space:nowrap}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--faint)}
  .dot.on{background:var(--up);box-shadow:0 0 8px var(--up)}
  .dot.local{background:var(--gold);box-shadow:0 0 8px var(--gold)}

  /* ---------- MONITOR ---------- */
  #view-monitor{min-height:100%;display:flex;flex-direction:column;background:var(--bg)}
  .mon-head{display:flex;align-items:baseline;gap:20px;padding:16px 26px 8px}
  .mon-head h1{font-size:clamp(18px,2.4vw,30px);letter-spacing:2px}
  .mon-head h1 .tick{color:var(--gold)}
  .mon-round{font-size:clamp(15px,1.8vw,22px);color:var(--gold);font-weight:800;letter-spacing:1px}
  .mon-clock{margin-left:auto;display:flex;align-items:center;gap:12px}
  .mon-clock .lbl{color:var(--faint);font-size:clamp(10px,1vw,13px);letter-spacing:1.5px;text-transform:uppercase}
  .mon-clock .cd{font-family:var(--mono);font-weight:800;font-size:clamp(28px,4vw,54px);line-height:1;
                 letter-spacing:2px;color:var(--up);font-variant-numeric:tabular-nums}
  .mon-clock .cd.warn{color:var(--gold)}
  .mon-clock .cd.crit{color:var(--down);animation:latir 1s infinite}
  .mon-clock .cd.done{color:var(--down)}
  @keyframes latir{0%,100%{opacity:1}50%{opacity:.35}}
  .mon-grid{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:10px;padding:10px 14px}
  @media (max-width:1000px){.mon-grid{grid-template-columns:repeat(2,1fr)}}
  @media (max-width:640px){.mon-grid{grid-template-columns:1fr}}
  .mcard{background:linear-gradient(180deg,var(--panel) 0%,var(--bg2) 100%);border:1px solid var(--line);
         border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-height:0;overflow:hidden}
  .mcard .head{display:flex;align-items:center;gap:8px}
  .mcard .name{font-weight:700;font-size:clamp(12px,1.05vw,15px);letter-spacing:.3px;line-height:1.2}
  .mcard .tk{font-family:var(--mono);color:var(--dim);font-size:12px}
  .mcard .pricerow{display:flex;align-items:baseline;gap:12px}
  .mcard .price{font-family:var(--mono);font-size:clamp(26px,2.6vw,40px);font-weight:800}
  .mcard .price.flash-up{animation:flashUp 1.2s ease}
  .mcard .price.flash-down{animation:flashDown 1.2s ease}
  @keyframes flashUp{0%{color:var(--up);text-shadow:0 0 18px var(--up)}100%{color:var(--txt)}}
  @keyframes flashDown{0%{color:var(--down);text-shadow:0 0 18px var(--down)}100%{color:var(--txt)}}
  .mcard .chg{font-size:clamp(13px,1.2vw,17px)}
  .book{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-family:var(--mono);font-size:clamp(10px,.9vw,12px)}
  .book table{width:100%;border-collapse:collapse}
  .book caption{text-align:left;color:var(--faint);font-size:10px;letter-spacing:1px;padding-bottom:2px}
  .book td{padding:1px 4px;white-space:nowrap}
  .book .q{color:var(--dim);text-align:right}
  .book .bid td.p{color:var(--up)} .book .ask td.p{color:var(--down)}
  .spark{width:100%;height:44px;min-height:34px}
  .spark polyline{fill:none;stroke:var(--blue);stroke-width:2}
  .spark .area{fill:url(#sparkfill);stroke:none}
  .mon-tape{background:#05070d;border-top:1px solid var(--line);overflow:hidden;white-space:nowrap;padding:9px 0}
  .tape-inner{display:inline-block;animation:tape 40s linear infinite;font-family:var(--mono);font-size:16px}
  .tape-inner span{margin:0 26px}
  @keyframes tape{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
  .mon-controls{position:fixed;bottom:14px;right:14px;display:flex;gap:8px;opacity:.25;transition:opacity .2s;z-index:30}
  .mon-controls:hover{opacity:1}

  /* bell overlay */
  #bell-overlay{position:fixed;inset:0;background:rgba(4,6,12,.88);display:flex;flex-direction:column;
                align-items:center;justify-content:center;gap:16px;z-index:100;backdrop-filter:blur(4px)}
  #bell-overlay .bell{font-size:110px;animation:ring 1s ease infinite}
  @keyframes ring{0%,100%{transform:rotate(0)}20%{transform:rotate(18deg)}40%{transform:rotate(-14deg)}
                  60%{transform:rotate(9deg)}80%{transform:rotate(-5deg)}}
  #bell-overlay h2{font-size:clamp(26px,4vw,46px);letter-spacing:2px;color:var(--gold)}
  #bell-overlay p{color:var(--dim);font-size:18px}

  /* ---------- GRUPO ---------- */
  #view-grupo{max-width:680px;margin:0 auto;padding-bottom:90px}
  .g-section{padding:16px}
  .meta-bar{display:flex;gap:10px;flex-wrap:wrap;padding:12px 16px}
  .stat{flex:1;min-width:140px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
  .stat .lbl{color:var(--dim);font-size:11.5px;letter-spacing:.6px;text-transform:uppercase}
  .stat .val{font-family:var(--mono);font-size:21px;font-weight:800;margin-top:2px}
  .asset-row{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
  .asset-row .r1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .asset-row .nm{font-weight:700;font-size:15.5px}
  .asset-row .px{margin-left:auto;font-family:var(--mono);font-size:19px;font-weight:800}
  .asset-row .r2{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
  .qty-ctrl{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .qty-ctrl button{width:44px;height:44px;font-size:22px;font-weight:800;background:var(--panel2);color:var(--txt)}
  .qty-ctrl input{width:74px;height:44px;text-align:center;background:var(--bg2);border:none;color:var(--txt);
                  font-family:var(--mono);font-size:18px;font-weight:700}
  .qty-ctrl input:focus{outline:none;background:#101a33}
  .asset-row .sub{color:var(--dim);font-size:13px;margin-top:6px;font-family:var(--mono)}
  .asset-row .own{font-size:13px;color:var(--blue);font-family:var(--mono)}
  .cashbar{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid var(--line);
           padding:10px 16px;display:flex;align-items:center;gap:14px;z-index:25}
  .cashbar .inner{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:14px;width:100%}
  .cashbar .c-lbl{color:var(--dim);font-size:12px}
  .cashbar .c-val{font-family:var(--mono);font-size:20px;font-weight:800}
  .cashbar .warn{color:var(--down)}
  .case-card{border-left:4px solid var(--gold);color:var(--txt);font-family:var(--sans)}
  .case-card h3{color:var(--gold);margin-bottom:6px}
  .case-card p{color:var(--txt);line-height:1.5;font-size:15px}
  .case-card .meta{margin-top:10px;background:var(--bg2);border-radius:10px;padding:10px 14px;
                   font-family:var(--mono);font-size:15px;color:var(--txt);line-height:1.5}
  .case-card .meta b{color:var(--gold)}
  .donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center}
  .legend{font-size:13.5px;display:flex;flex-direction:column;gap:5px}
  .legend .sw{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:7px}
  .result-hero{text-align:center;padding:26px 16px}
  .result-hero .big{font-family:var(--mono);font-size:44px;font-weight:800}
  .result-hero .pct{font-size:22px;font-family:var(--mono);font-weight:700}
  .goal-badge{display:inline-block;margin-top:10px;padding:8px 18px;border-radius:999px;font-weight:800;font-size:15px}
  .goal-ok{background:var(--up-dim);color:var(--up);border:1px solid var(--up)}
  .goal-no{background:var(--down-dim);color:var(--down);border:1px solid var(--down)}
  .goal-mid{background:rgba(245,197,66,.12);color:var(--gold);border:1px solid var(--gold)}
  .lesson{background:var(--bg2);border:1px dashed var(--line);border-radius:12px;padding:14px;color:var(--dim);
          font-size:14px;line-height:1.55;margin-top:14px}
  .lesson b{color:var(--txt)}
  .code-box{font-family:var(--mono);font-size:34px;font-weight:800;letter-spacing:6px;color:var(--gold);
            background:var(--bg2);border:2px dashed var(--gold);border-radius:14px;padding:16px;text-align:center}
  .step-title{font-size:22px;font-weight:800;padding:18px 16px 6px}
  .step-sub{color:var(--dim);padding:0 16px 12px;font-size:14.5px;line-height:1.5}
  .waiting{display:flex;flex-direction:column;align-items:center;gap:16px;padding:60px 20px;text-align:center;color:var(--dim)}
  .pulse{width:64px;height:64px;border-radius:50%;background:var(--panel2);display:flex;align-items:center;
         justify-content:center;font-size:30px;animation:pulse 1.6s ease infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(77,163,255,.4)}50%{box-shadow:0 0 0 18px rgba(77,163,255,0)}}
  .varrow{font-family:var(--mono);font-size:13.5px}

  /* ---------- COORDINADOR ---------- */
  #view-coord{max-width:1100px;margin:0 auto;padding:16px}
  .coord-grid{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start}
  @media (max-width:900px){.coord-grid{grid-template-columns:1fr}}
  .session-code{font-family:var(--mono);font-size:46px;font-weight:800;letter-spacing:10px;color:var(--gold);text-align:center}
  .groups-table{width:100%;border-collapse:collapse;font-size:14.5px}
  .groups-table th{text-align:left;color:var(--dim);font-size:12px;letter-spacing:.6px;text-transform:uppercase;
                   padding:8px 10px;border-bottom:1px solid var(--line)}
  .groups-table td{padding:10px;border-bottom:1px solid var(--line)}
  .groups-table .mono{font-size:15px}
  .sem{display:inline-block;width:12px;height:12px;border-radius:50%}
  .sem.g{background:var(--up)} .sem.y{background:var(--gold)} .sem.r{background:var(--down)} .sem.off{background:var(--faint)}
  .podium{display:flex;align-items:flex-end;justify-content:center;gap:12px;padding:20px 0}
  .pod{background:var(--panel2);border:1px solid var(--line);border-radius:12px 12px 0 0;width:150px;
       display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:12px 8px;text-align:center}
  .pod .medal{font-size:34px}
  .pod .nm{font-weight:800;font-size:15px;margin:4px 0}
  .pod .vl{font-family:var(--mono);color:var(--dim);font-size:13px}
  .pod.p1{height:190px;border-color:var(--gold)} .pod.p2{height:150px} .pod.p3{height:120px}
  .mcard .since{display:flex;justify-content:space-between;align-items:baseline;margin-top:5px;
                 padding-top:5px;border-top:1px dashed var(--line);font-size:clamp(10px,1vw,13px)}
  .mcard .since .lb{color:var(--faint);letter-spacing:.5px;text-transform:uppercase}
  .mcard .since .vl{font-family:var(--mono);font-weight:800;font-size:clamp(12px,1.2vw,16px)}
  /* --- noticias --- */
  .news{background:var(--bg2);border:1px solid var(--line);border-left:3px solid var(--gold);
        border-radius:10px;padding:12px 14px;margin-bottom:10px}
  .news .src{display:flex;align-items:center;gap:7px;color:var(--faint);font-size:11.5px;
             letter-spacing:.7px;text-transform:uppercase;margin-bottom:5px}
  .news h4{font-size:15.5px;line-height:1.35;margin-bottom:5px}
  .news p{color:var(--dim);font-size:13.5px;line-height:1.55;margin:0}
  .news .clave{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);
               color:var(--gold);font-size:13px;line-height:1.5}
  .news-title{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:800;
              letter-spacing:.5px;text-transform:uppercase;color:var(--gold);margin:0 0 10px}
  .mon-news{background:#05070d;border-top:1px solid var(--line);padding:12px 18px;display:flex;gap:16px;
            align-items:center;min-height:64px}
  .mon-news .lbl{background:var(--down);color:#fff;font-weight:800;font-size:13px;letter-spacing:1px;
                 padding:5px 11px;border-radius:5px;white-space:nowrap}
  .mon-news .txt{font-size:clamp(15px,1.6vw,21px);font-weight:700;line-height:1.35}
  .mon-news .sub{color:var(--faint);font-size:clamp(11px,1.1vw,14px);font-weight:400;margin-top:3px}
  /* --- panel de puntaje --- */
  .score-hero{text-align:center;padding:16px 10px 20px}
  .score-hero .num{font-family:var(--mono);font-size:66px;font-weight:800;line-height:1}
  .score-hero .den{color:var(--faint);font-size:15px;margin-top:2px}
  .score-hero .niv{font-size:19px;font-weight:800;letter-spacing:1px;margin-top:8px}
  .sbar{margin-bottom:14px}
  .sb-l{display:flex;justify-content:space-between;align-items:baseline;font-size:14.5px;margin-bottom:5px}
  .sb-l b{font-family:var(--mono);font-size:15px}
  .sb-t{height:10px;background:var(--bg2);border-radius:999px;overflow:hidden}
  .sb-t i{display:block;height:100%;border-radius:999px;transition:width .5s ease}
  .sb-h{color:var(--faint);font-size:12.5px;margin-top:5px;line-height:1.45}
  .fb{display:flex;gap:11px;align-items:flex-start;background:var(--bg2);border:1px dashed var(--line);
      border-radius:12px;padding:12px 14px;margin-bottom:9px;font-size:14px;line-height:1.55;color:var(--dim)}
  .fb .ico{font-size:19px;line-height:1.2}
  .pod .sc{font-family:var(--mono);font-size:22px;font-weight:800;color:var(--gold)}
  .coord-steps{display:flex;flex-direction:column;gap:10px}
  .hint{color:var(--faint);font-size:13px;line-height:1.5}
  h2.sec{font-size:16px;letter-spacing:.8px;text-transform:uppercase;color:var(--dim);margin:18px 0 10px}
</style>
</head>
<body>

<!-- ============ HOME ============ -->
<div id="view-home">
  <h1>LA BOLSA DE VALORES <span class="tick"><svg class="ingot" viewBox="0 0 24 20" aria-hidden="true"><path d="M2.5 17.5h19" stroke="#7a6420" stroke-width="1.2" stroke-linecap="round"/><path d="M2.5 17.5v-15" stroke="#7a6420" stroke-width="1.2" stroke-linecap="round"/><path d="M4.5 14.5 9 9.5l3.5 3L20 4.5" fill="none" stroke="#E0A81C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M14.6 4.5H20v5.4" fill="none" stroke="#FFDF7A" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></svg></span></h1>
  <p class="sub">Dinámica de educación financiera — Ahorrá, invertí y aprendé jugando.
     Elegí tu rol para comenzar.</p>
  <div class="role-grid">
    <button class="role-card" onclick="location.hash='#coordinador'">
      <div class="ico">🎛️</div><b>Coordinador</b>
      <span>Creá la sesión, controlá las rondas y mirá los portafolios de todos los grupos.</span>
    </button>
    <button class="role-card" onclick="location.hash='#grupo'">
      <div class="ico">👨‍👩‍👧‍👦</div><b>Grupo / Familia</b>
      <span>Armá tu portafolio con tu equipo y tratá de cumplir la meta de tu familia.</span>
    </button>
    <button class="role-card" onclick="location.hash='#monitor'">
      <div class="ico">📈</div><b>Monitor de Mercado</b>
      <span>Pantalla para el proyector: precios en vivo, como en una bolsa de verdad.</span>
    </button>
  </div>
  <p class="conn-note" id="home-conn"></p>
  <p class="conn-note" style="opacity:.65;margin-top:2px">
    versión <b class="mono" id="home-ver">—</b> · base de datos <b id="home-db">—</b></p>
</div>

<!-- ============ MONITOR ============ -->
<div id="view-monitor" class="hidden">
  <div class="mon-head">
    <h1>BOLSA DE VALORES <span class="tick">— MONTEVIDEO</span></h1>
    <div class="mon-round" id="mon-round">RONDA 1</div>
    <div id="mon-sala" style="font-size:clamp(10px,1vw,13px);letter-spacing:1.2px;color:var(--faint);
         text-transform:uppercase;margin-left:18px"></div>
    <div class="mon-clock"><span class="lbl">Tiempo</span><span class="cd" id="mon-clock">--:--</span></div>
  </div>

/* ================================================================
   ESCENARIO DE CIERRE — define los precios de la Ronda 3
   ================================================================ */
let SCEN = 'A';

function applyScenario(letter){
  const map = GAME_DATA.scenarios[letter] || GAME_DATA.scenarios.A;
  SCEN = GAME_DATA.scenarios[letter] ? letter : 'A';
  for(const a of GAME_DATA.assets){
    if(a.r3 && map[a.id]) a.prices[2] = a.r3[map[a.id]];
    if(a.r4 && map[a.id]) a.prices[3] = a.r4[map[a.id]];
  }
  return SCEN;
}
function scenarioRoles(){
  return GAME_DATA.scenarios[SCEN] || GAME_DATA.scenarios.A;
}
function assetByRole(role){
  const map = scenarioRoles();
  const id = Object.keys(map).find(k => map[k] === role);
  return Engine ? GAME_DATA.assets.find(a=>a.id===id) : null;
}
function drawScenario(){
  const ks = Object.keys(GAME_DATA.scenarios);
  return applyScenario(ks[Math.floor(Math.random()*ks.length)]);
}

/* Libro de órdenes estático por activo y ronda (estilo pantalla de bolsa).
   Se genera de forma determinística alrededor del precio de la ronda. */
function orderBook(asset, round){
  const p = asset.prices[round-1];
  const step = Math.max(p*0.008, 0.1);
  const seed = (asset.id.charCodeAt(0)+asset.id.charCodeAt(1))*round;
  const q = i => Math.round((((seed*31+i*17) % 90)+10)) * (asset.type==='stock'?1000:asset.type==='fund'?5000:100);
  const fmt = v => v>=100 ? v.toFixed(1) : v.toFixed(2);
  const bids=[], asks=[];
  for(let i=1;i<=3;i++){
    bids.push({q:q(i), p:fmt(p - step*i)});
    asks.push({q:q(i+3), p:fmt(p + step*i)});
  }
  return {bids, asks};
}

/* ================================================================
   ENGINE — cálculos del juego
   ================================================================ */
const Engine = {
  assetById(id){ return GAME_DATA.assets.find(a=>a.id===id); },
  price(id, round){ return this.assetById(id).prices[round-1]; },

  newPortfolio(){
    return { holdings:{}, cash:GAME_DATA.budget, lrm:0, lrmInterest:0, coupons:0,
             cost:{}, realizedLoss:0, fees:0, snaps:[] };
  },

  /* valor total del portafolio a precios de la ronda dada */
  value(pf, round){
    let v = pf.cash + pf.lrm;
    for(const [id,qty] of Object.entries(pf.holdings)){
      v += qty * this.price(id, round);
    }
    return v;
  },

  /* Pasaje de ronda: acredita cupones de bonos e intereses de LRM como cash */
  accrue(pf){
    let coupons = 0;
    for(const [id,qty] of Object.entries(pf.holdings)){
      const a = this.assetById(id);
      if(a.coupon) coupons += qty * 100 * a.coupon; // cupón sobre valor nominal 100
    }
    let lrmInt = 0;
    if(pf.lrm > 0){
      lrmInt = pf.lrm * GAME_DATA.lrmRate;
      pf.cash += pf.lrm + lrmInt;   // la LRM vence: capital + interés vuelven a cash
      pf.lrm = 0;
    }
    pf.cash += coupons;
    pf.coupons += coupons;
    pf.lrmInterest += lrmInt;
    return {coupons, lrmInt};
  },

  /* aplica una orden {id, qty} positiva=compra, negativa=venta; a precios de round */
  fee(qty, px){ return Math.abs(qty) * px * GAME_DATA.fee; },   // se cobra al comprar y al vender

  trade(pf, id, qty, round){
    const px = this.price(id, round);
    const fee = this.fee(qty, px);
    const cost = qty * px + fee;                          // comprar resta; vender suma, menos la comisión
    const owned = pf.holdings[id]||0;
    if(qty > 0 && cost > pf.cash + 1e-9) return {ok:false, err:'No te alcanza el efectivo.'};
    if(qty < 0 && -qty > owned) return {ok:false, err:'No tenés esa cantidad para vender.'};
    if(!pf.cost) pf.cost = {};
    if(qty !== 0) pf.fees = (pf.fees||0) + fee;
    if(qty > 0){
      pf.cost[id] = (pf.cost[id]||0) + cost;              // acumula lo pagado, comisión incluida
    } else if(qty < 0 && owned > 0){
      const avg = (pf.cost[id]||0) / owned;               // costo promedio por unidad
      const pnl = (-qty) * (px - avg) - fee;             // resultado realizado, comisión incluida
      /* Sólo cuenta como pánico si venden con pérdida MIENTRAS el mercado cae.
         Reacomodar la cartera después, con la información ya sobre la mesa,
         es gestión de cartera, no pánico. */
      if(pnl < 0 && GAME_DATA.panicRounds.includes(round))
        pf.realizedLoss = (pf.realizedLoss||0) + (-pnl);
      pf.cost[id] = (pf.cost[id]||0) + qty * avg;
      if(pf.cost[id] < 0.01) pf.cost[id] = 0;
    }
    pf.holdings[id] = owned + qty;
    if(pf.holdings[id]===0){ delete pf.holdings[id]; delete pf.cost[id]; }
    pf.cash -= cost;
    return {ok:true};
  },

  placeLRM(pf, amount){
    amount = Math.min(amount, pf.cash);
    if(amount<=0) return;
    pf.cash -= amount;
    pf.lrm += amount;
  },

  /* Código de resultado para modo offline: valor final en base36 + checksum */
  /* Empaqueta valor + puntaje + familia en un solo número, con verificador.
     n = valor*10000 + puntaje*10 + índice de familia  */
  resultCode(finalValue, score, caseId){
    const v = Math.round(finalValue);
    const sc = Math.max(0, Math.min(999, Math.round(score||0)));
    const ci = Math.max(0, GAME_DATA.cases.findIndex(c=>c.id===caseId));
    const n = v*10000 + sc*10 + ci;
    return n.toString(36).toUpperCase() + '-' + (n % 23).toString(36).toUpperCase();
  },
  decodeResult(code){
    const m = (code||'').trim().toUpperCase().match(/^([0-9A-Z]+)-([0-9A-Z])$/);
    if(!m) return null;
    const n = parseInt(m[1], 36);
    if(isNaN(n) || n < 0) return null;
    if((n % 23).toString(36).toUpperCase() !== m[2]) return null;
    const ci = n % 10;
    const score = Math.floor(n/10) % 1000;
    const value = Math.floor(n/10000);
    const c = GAME_DATA.cases[ci];
    return {value, score, caseId: c ? c.id : null};
  },

  fmt(n, dec=0){
    return n.toLocaleString('es-UY', {minimumFractionDigits:dec, maximumFractionDigits:dec});
  },
  fmtUSD(n, dec=0){ return 'USD ' + this.fmt(n, dec); },
  pct(n, dec=1){ return (n>0?'+':'') + (n*100).toFixed(dec).replace('.',',') + '%'; }
};

/* ================================================================
   SCORE — puntaje de la dinámica (sobre 100, + hasta 5 de bonus)

   40  Meta cumplida       — contra la meta de la propia familia
   30  Diversificación     — promedio de las rondas, no sólo el final
   20  Perfil de riesgo    — coherencia con el mandato de la familia
   10  Disciplina          — no vender con pérdida, no dejar dinero ocioso
   +5  Bonus por superar la meta (techo bajo a propósito)
   ================================================================ */
const SCORE_W = { meta:40, div:30, perfil:20, disc:10, bonus:5 };

/* El fondo indexado ya está diversificado por dentro: cuenta como 3 activos.
   Es la forma más simple de que se entienda qué compraron. */
const FUND_EQUIV = 3;
const DIV_TARGET = 4;      // 4 posiciones efectivas = puntaje completo
const CASH_TOL   = 0.15;   // hasta 15% de efectivo ocioso no se penaliza
const LOSS_TOL   = 0.05;   // pérdidas realizadas por 5% del capital = 0 puntos

const Score = {
  clamp(x, a=0, b=1){ return Math.max(a, Math.min(b, x)); },

  /* Foto de la composición al cerrar una ronda */
  snapshot(pf, round){
    const parts = [];
    let risk = 0, total = 0;
    for(const [id,q] of Object.entries(pf.holdings)){
      const a = Engine.assetById(id);
      const v = q * Engine.price(id, round);
      if(v <= 0) continue;
      total += v;
      if(a.type === 'stock' || a.type === 'fund') risk += v;
      // el fondo se abre en varias posiciones para premiar su diversificación interna
      const n = (a.type === 'fund') ? FUND_EQUIV : 1;
      for(let i=0;i<n;i++) parts.push(v/n);
    }
    if(pf.lrm > 0){ parts.push(pf.lrm); total += pf.lrm; }
    const cash = Math.max(0, pf.cash);
    if(cash > 0){ parts.push(cash); total += cash; }
    if(total <= 0) return {round, neff:1, riskShare:0, cashShare:1};
    let hhi = 0;
    for(const v of parts) hhi += Math.pow(v/total, 2);
    return {
      round,
      neff: 1/hhi,
      riskShare: risk/total,
      cashShare: cash/total
    };
  },

  record(pf, round){
    if(!pf.snaps) pf.snaps = [];
    pf.snaps = pf.snaps.filter(s => s.round !== round);
    pf.snaps.push(this.snapshot(pf, round));
    pf.snaps.sort((a,b)=>a.round-b.round);
  },

  /* Puntaje completo. round = ronda en la que se valúa (3 al cierre). */
  compute(pf, caseObj, round){
    const B = GAME_DATA.budget;
    const value = Engine.value(pf, round);
    const ret = (value - B) / B;
    const snaps = (pf.snaps && pf.snaps.length) ? pf.snaps : [this.snapshot(pf, round)];

    /* --- 40 · META --- */
    const metaRet = caseObj ? caseObj.metaRet : 0.18;
    let metaFrac = this.clamp(ret / metaRet);
    const rompioCapital = caseObj && caseObj.protegeCapital && value < B;
    if(rompioCapital) metaFrac = 0;
    const meta = SCORE_W.meta * metaFrac;

    /* --- 30 · DIVERSIFICACIÓN --- */
    const divFracs = snaps.map(s => this.clamp((s.neff - 1) / (DIV_TARGET - 1)));
    const divFrac = divFracs.reduce((a,b)=>a+b, 0) / divFracs.length;
    const div = SCORE_W.div * divFrac;

    /* --- 20 · PERFIL DE RIESGO --- */
    const band = caseObj ? caseObj.perfil : {min:0.30, max:0.70};
    const perfilFracs = snaps.map(s => {
      const r = s.riskShare;
      if(r >= band.min && r <= band.max) return 1;
      const d = (r < band.min) ? (band.min - r) : (r - band.max);
      return this.clamp(1 - d/0.30);
    });
    const perfilFrac = perfilFracs.reduce((a,b)=>a+b, 0) / perfilFracs.length;
    const perfil = SCORE_W.perfil * perfilFrac;

    /* --- 10 · DISCIPLINA (6 no vender con pérdida + 4 no dejar dinero quieto) --- */
    const loss = pf.realizedLoss || 0;
    const noPanicFrac = this.clamp(1 - loss / (LOSS_TOL * B));
    const avgCash = snaps.reduce((a,s)=>a+s.cashShare, 0) / snaps.length;
    const noIdleFrac = this.clamp(1 - avgCash / CASH_TOL);
    const disc = 6 * noPanicFrac + 4 * noIdleFrac;

    /* --- +5 · BONUS por superar la meta --- */
    const bonus = SCORE_W.bonus * this.clamp((ret - metaRet) / metaRet);

    const total = meta + div + perfil + disc + bonus;
    return {
      value, ret, total,
      meta, div, perfil, disc, bonus,
      metaFrac, divFrac, perfilFrac,

  feedback(sc, caseObj){

    const b = sc.band;

/* ================================================================
   SYNC — sincronización de la sesión
   Modo ONLINE:  pegá la configuración de tu proyecto Firebase acá
                 (ver README.md). Si es null o no hay internet, la app
                 usa BroadcastChannel (ventanas de la misma PC) y todo
                 lo demás funciona en modo offline.
   ================================================================ */
/* Base de datos de la sesión (Realtime Database de Firebase, proyecto BCUEduca).
   La apiKey no es una contraseña: queda visible en cualquier web que use Firebase.
   Quien protege la base son las reglas, no esta clave.
   Para volver al modo sin servidor, poner: const FIREBASE_CONFIG = null; */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCEOIBXMCVng3AQWe05yDaHBA3JvF4jvjY",
  authDomain: "bcueduca-f6fbe.firebaseapp.com",
  databaseURL: "https://bcueduca-f6fbe-default-rtdb.firebaseio.com",
  projectId: "bcueduca-f6fbe"
};

const Sync = {
  mode:'off', code:null, role:null,
  _cbState:null, _cbGroup:null, _bc:null, _db:null,

  async connect(code, role, {onState, onGroup}={}){
    this.code = (code||'BVM1').toUpperCase();
    this.role = role;
    this._cbState = onState; this._cbGroup = onGroup;
    if(FIREBASE_CONFIG && navigator.onLine){
      try{ await this._initFirebase(); this.mode='online'; }
      catch(e){
        console.warn('Firebase no disponible, uso modo local:', e && e.message);
        this.fallbackReason = (e && e.message) || 'sin conexión';
        this._initLocal();
      }
    } else {
      this._initLocal();
    }
    this._updatePills();
  },

  _initLocal(){
    if(typeof BroadcastChannel === 'undefined'){ this.mode='off'; return; }
    if(this._bc) this._bc.close();
    this.mode='local';
    this._bc = new BroadcastChannel('bvm-'+this.code);
    this._bc.onmessage = (ev)=>{
      const m = ev.data||{};
      if(m.type==='state' && this._cbState) this._cbState(m.state);
      if(m.type==='group' && this._cbGroup) this._cbGroup(m.group);
      if(m.type==='hello'){
        // el coordinador re-publica el estado para los que llegan tarde
        if(this.role==='coord' && Coord.session) this.sendState(Coord.session.state);
        if(this.role==='group' && Grupo.st && Grupo.st.joined) this.sendGroup(Grupo.publicGroup());
      }
    };
    this._bc.postMessage({type:'hello'});
  },

  async _initFirebase(){
    if(!window.firebase){
      await this._loadScript('https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js');
      await this._loadScript('https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js');
    }
    if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    this._db = firebase.database();

    /* Verificamos que la base responda ANTES de darnos por conectados.
       Sin esto, una configuración mal copiada deja la app creyendo que está
       en línea y no cae nunca al modo local: el error original de esta app. */
    await new Promise((res, rej)=>{
      const t = setTimeout(()=>{ ref.off(); rej(new Error('la base no respondió')); }, 8000);
      const ref = this._db.ref('.info/connected');
      ref.on('value', snap=>{
        if(snap.val() === true){ clearTimeout(t); ref.off(); res(); }
      }, err=>{ clearTimeout(t); ref.off(); rej(err); });
    });

    const base = 'sesiones/'+this.code;
    this._db.ref(base+'/state').on('value', s=>{
      const v = s.val(); if(v && this._cbState) this._cbState(v);
    });
    this._db.ref(base+'/groups').on('child_added', s=>{ if(this._cbGroup) this._cbGroup(s.val()); });
    this._db.ref(base+'/groups').on('child_changed', s=>{ if(this._cbGroup) this._cbGroup(s.val()); });
  },

  _loadScript(src){
    return new Promise((res,rej)=>{
      const t = setTimeout(()=>rej(new Error('timeout')), 7000);
      const s = document.createElement('script');
      s.src = src; s.onload = ()=>{clearTimeout(t);res();}; s.onerror = ()=>{clearTimeout(t);rej(new Error('load'));};
      document.head.appendChild(s);
    });
  },

  sendState(state){
    if(this.mode==='online') this._db.ref('sesiones/'+this.code+'/state').set(state);
    else if(this.mode==='local' && this._bc) this._bc.postMessage({type:'state', state});
  },
  sendGroup(group){
    if(this.mode==='online') this._db.ref('sesiones/'+this.code+'/groups/'+group.id).set(group);
    else if(this.mode==='local' && this._bc) this._bc.postMessage({type:'group', group});
  },

  label(){
    return this.mode==='online' ? 'En línea (sesión '+this.code+')'
         : this.mode==='local'  ? 'Local — misma PC (sesión '+this.code+')'
         : 'Sin conexión — modo autónomo';
  },
  _updatePills(){
    document.querySelectorAll('.conn-pill').forEach(el=>{
      el.innerHTML = '<span class="dot '+(this.mode==='online'?'on':this.mode==='local'?'local':'')+'"></span> '+this.label();
    });
  }
};

/* ================================================================
   CAMPANA — sonido generado por el navegador, sin archivos externos.
   Una campana real no suena a una nota sola: vibra en frecuencias que
   no son múltiplos exactos de la fundamental. Por eso las proporciones
   raras de PARCIALES: son las que le dan el timbre metálico.
   ================================================================ */
const Campana = {
  ctx: null,
  muted: localStorage.getItem('bvm_mute') === '1',

  /* Los navegadores no dejan sonar nada hasta que la persona toca algo.
     Enganchamos el primer toque para dejar el audio listo. */
  init(){
    const abrir = () => {
      if(!this.ctx){
        const AC = window.AudioContext || window.webkitAudioContext;
        if(AC) this.ctx = new AC();
      }
      if(this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    };
    ['pointerdown','keydown','touchstart'].forEach(ev =>
      window.addEventListener(ev, abrir, {passive:true}));
  },

  toggle(){
    this.muted = !this.muted;
    localStorage.setItem('bvm_mute', this.muted ? '1' : '0');
    if(!this.muted) this.tocar(1);
    document.querySelectorAll('.mute-btn').forEach(b => b.textContent = this.muted ? '🔕' : '🔔');
  },

  /* Un golpe de badajo */
  golpe(t0, vol){
    const ctx = this.ctx;
    const PARCIALES = [
      {r:0.56, g:1.00, d:3.6},   // el "hum", el zumbido grave que queda flotando
      {r:1.00, g:0.85, d:3.0},   // la fundamental
      {r:1.50, g:0.55, d:2.2},
      {r:2.24, g:0.42, d:1.5},
      {r:2.76, g:0.35, d:1.1},
      {r:4.07, g:0.22, d:0.7},
      {r:5.43, g:0.15, d:0.45}
    ];
    const BASE = 520;
    const master = ctx.createGain();
    master.gain.value = vol;
    master.connect(ctx.destination);

    for(const p of PARCIALES){
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = BASE * p.r;
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(p.g * 0.16, t0 + 0.004);   // ataque casi instantáneo
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + p.d);    // los agudos se apagan antes
      osc.connect(g); g.connect(master);
      osc.start(t0); osc.stop(t0 + p.d + 0.1);
    }

    /* El "clang" del metal al ser golpeado: ruido muy corto y filtrado */
    const dur = 0.16;
    const buf = ctx.createBuffer(1, Math.ceil(ctx.sampleRate*dur), ctx.sampleRate);
    const data = buf.getChannelData(0);
    for(let i=0;i<data.length;i++) data[i] = (Math.random()*2-1) * Math.pow(1-i/data.length, 5);
    const src = ctx.createBufferSource(); src.buffer = buf;
    const bp = ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=2600; bp.Q.value=1.2;
    const ng = ctx.createGain(); ng.gain.value = 0.16;
    src.connect(bp); bp.connect(ng); ng.connect(master);
    src.start(t0); src.stop(t0 + dur);
  },

  /* Varios golpes, como la campana de apertura de una bolsa de verdad */
  tocar(golpes = 3){
    if(this.muted) return;
    if(!this.ctx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      this.ctx = new AC();
    }
    if(this.ctx.state === 'suspended') this.ctx.resume();
    const t0 = this.ctx.currentTime + 0.03;
    for(let i=0;i<golpes;i++) this.golpe(t0 + i*0.52, i===0 ? 1 : 0.82 - i*0.06);
  }
};

function ringBell(title, sub, ms=3800){
  Campana.tocar(3);
  const o = document.getElementById('bell-overlay');
  document.getElementById('bell-title').textContent = title;

  clearTimeout(ringBell._t);
  ringBell._t = setTimeout(()=>o.classList.add('hidden'), ms);
}

/* ================================================================
   MONITOR — pantalla de mercado para el proyector
   ================================================================ */
const Monitor = {
  round:1, mounted:false, groups:{}, _recibida:null,

  /* Ranking en vivo, ordenado por puntaje igual que el del coordinador */
  ranking(){
    return Object.values(this.groups)
      .filter(g => g && g.name)
      .sort((a,b) => ((b.score||0)-(a.score||0)) || ((b.value||0)-(a.value||0)));
  },

  mount(){
    if(!this.mounted){
      this.mounted = true;
      setInterval(()=>{
        const d = new Date();
        Monitor.tickTimer();
      }, 1000);
      const params = new URLSearchParams((location.hash.split('?')[1]||''));
      this._sala = params.get('sala')||localStorage.getItem('bvm_code')||'BVM1';
      setTimeout(()=>{
        const el = document.getElementById('mon-sala');
        if(el) el.innerHTML = 'Sala <b style="color:var(--dim)">'+this._sala+'</b> · '
          + (Sync.mode==='online' ? '<b style="color:var(--up)">en línea</b>'
             : Sync.mode==='local' ? '<b style="color:var(--gold)">local</b>'
             : '<b style="color:var(--down)">manual</b>');
      }, 1500);
      Sync.connect(params.get('sala')||localStorage.getItem('bvm_code')||'BVM1', 'monitor', {
        onState: st=>{
          if(!st) return;
          if(st.scen) applyScenario(st.scen);
          if(st.phase === 'lobby') return;
          if(st.round && st.round !== this._recibida){
            this._recibida = st.round;
            this.setRound(st.round, true);
          }
        },
        onGroup: g=>{ if(g && g.id){ this.groups[g.id] = g; if(this.round>=GAME_DATA.rounds) this.renderNews(); } }
      });
    }
    this.render();
  },

  /* Cambio manual del escenario de cierre (modo sin conexión) */
  /* ---------- cronómetro de ronda ---------- */
  timerLeft: null, timerOn: false,

  startTimer(r){
    const min = (GAME_DATA.timers && GAME_DATA.timers[r]) || 0;
    this.timerLeft = min * 60;
    this.timerOn = min > 0;
    this._avisado = false;
    this.paintTimer();
  },
  toggleTimer(){ if(this.timerLeft!==null) this.timerOn = !this.timerOn; this.paintTimer(); },
  addTime(min){ if(this.timerLeft===null) this.timerLeft = 0;
                this.timerLeft += min*60; this._avisado = false; this.timerOn = true; this.paintTimer(); },
  tickTimer(){
    if(this.timerOn && this.timerLeft > 0){
      this.timerLeft--;
      if(this.timerLeft === 0 && !this._avisado){ this._avisado = true; Campana.tocar(1); }
    }
    this.paintTimer();
  },
  paintTimer(){
    const el = document.getElementById('mon-clock');
    if(!el) return;
    if(this.timerLeft === null){ el.textContent = '--:--'; el.className = 'cd'; return; }
    const t = Math.max(0, this.timerLeft);
    const mm = String(Math.floor(t/60)).padStart(2,'0');
    const ss = String(t%60).padStart(2,'0');
    el.textContent = t===0 ? 'TIEMPO' : (mm+':'+ss);
    el.className = 'cd' + (t===0 ? ' done' : t<=60 ? ' crit' : t<=120 ? ' warn' : '')
                        + (this.timerOn || t===0 ? '' : ' warn');
  },

  setScen(letra){
    applyScenario(letra);
    if(this.round === 3) ringBell('CIERRE — ESCENARIO ' + letra, 'La recuperación no fue pareja', 2000);
    this.render();
  },

  /* Banda de titulares: rota cada 9 segundos, como el zócalo de un canal */
  renderNews(){
    const box = document.getElementById('mon-news');
    if(!box) return;
    clearInterval(this._newsTimer);

    /* Cerrado el mercado, el zócalo deja de dar noticias y pasa a dar resultados */
    if(this.round >= GAME_DATA.rounds){
      const rk = this.ranking();
      if(rk.length){
        const medalla = ['🥇','🥈','🥉'];
        const podio = rk.slice(0,3).map((g,i)=>
          `<span style="margin-right:22px">${medalla[i]||''} <b>${g.name}</b>
             <span style="color:var(--gold);font-family:var(--mono)">${(g.score||0).toFixed(1).replace('.',',')} pts</span></span>`
        ).join('');
        box.innerHTML = `<span class="lbl" style="background:var(--gold);color:#1a1400">🏆 RESULTADO</span>
          <div class="txt">${podio}<div class="sub">Gana quien invirtió mejor de acuerdo a su objetivo, no quien más dinero juntó</div></div>`;
        return;
      }
      // sin grupos conectados (modo autónomo): mostramos el cierre del mercado
      box.innerHTML = `<span class="lbl" style="background:var(--gold);color:#1a1400">🔔 CIERRE</span>
        <div class="txt">Mercado cerrado — se calculan los puntajes
          <div class="sub">Cada grupo tiene su resultado en pantalla. Dicten su código al coordinador.</div></div>`;
      return;
    }

    let items = (GAME_DATA.news && GAME_DATA.news[this.round]) || [];
    if(items === 'DINAMICA') items = newsRonda3();   // el zócalo no entendía este caso: mostraba "undefined"
    if(!items.length){ box.innerHTML = ''; return; }
    let i = 0;
    const pintar = () => {
      const n = items[i % items.length];
      box.innerHTML = `<span class="lbl">${n.tag} ${n.src}</span>
        <div class="txt">${n.h}<div class="sub">${n.d}</div></div>`;
      i++;
    };
    pintar();
    this._newsTimer = setInterval(pintar, 9000);
  },

  setRound(r, bell){
    this.round = r;
    this.startTimer(r);                          // el cronómetro se reinicia siempre
    if(bell!==false) ringBell('¡SUENA LA CAMPANA!  RONDA '+r, ROUND_SUBS[r]||'');
    this.render(true);
  },

  render(flash){
    document.getElementById('mon-round').textContent = 'RONDA '+this.round+' DE '+GAME_DATA.rounds;
    const grid = document.getElementById('mon-grid');
    grid.innerHTML = GAME_DATA.assets.map(a=>{
      const p = a.prices[this.round-1];
      const prev = this.round>1 ? a.prices[this.round-2] : a.history[a.history.length-1];
      const chg = (p-prev)/prev;
      const cls = chg>0.0005?'up':chg<-0.0005?'down':'flat';
      const book = orderBook(a, this.round);
      const series = a.history.concat(a.prices.slice(0, this.round));
      return `
      <div class="mcard">
        <div class="head">
          <span class="tag tag-${a.type==='bond'?'bond':a.type==='fund'?'fund':'stock'}">${a.typeLabel}</span>
          <span class="name">${a.name}</span>
          <span class="tk">${a.ticker}</span>
        </div>
        <div class="pricerow">
          <span class="price mono ${flash?(cls==='up'?'flash-up':cls==='down'?'flash-down':''):''}">${p.toFixed(p<100?2:1).replace('.',',')}</span>
          <span class="chg ${cls}">${Engine.pct(chg)}</span>
        </div>
        <div class="book">
          <table class="bid"><caption>COMPRA</caption>
            ${book.bids.map(b=>`<tr><td class="q">${Engine.fmt(b.q)}</td><td class="p">${b.p}</td></tr>`).join('')}
          </table>
          <table class="ask"><caption>VENTA</caption>
            ${book.asks.map(b=>`<tr><td class="p">${b.p}</td><td class="q">${Engine.fmt(b.q)}</td></tr>`).join('')}
          </table>
        </div>
        ${sparkSVG(series)}
        ${this.round>1 ? (()=>{ const acum=(p-a.prices[0])/a.prices[0];
            const c = acum>0.0005?'up':acum<-0.0005?'down':'flat';
            return `<div class="since"><span class="lb">Desde el inicio</span>
              <span class="vl ${c}">${Engine.pct(acum)}</span></div>`; })() : ''}
      </div>`;
    }).join('');

    const tape = GAME_DATA.assets.map(a=>{
      const p = a.prices[this.round-1];
      const prev = this.round>1 ? a.prices[this.round-2] : a.history[a.history.length-1];
      const chg = (p-prev)/prev;
      const cls = chg>0.0005?'up':chg<-0.0005?'down':'flat';
      const arrow = chg>0.0005?'▲':chg<-0.0005?'▼':'▬';
      return `<span>${a.ticker} <b class="${cls}">${p.toFixed(2).replace('.',',')} ${arrow} ${Engine.pct(chg)}</b></span>`;
    }).join('');
    document.getElementById('mon-tape').innerHTML = tape + tape + tape + tape;
    this.renderNews();
  }
};

function sparkSVG(series){
  const min = Math.min(...series), max = Math.max(...series);
  const range = (max-min)||1;
  const W=100, H=40, pad=3;
  const pts = series.map((v,i)=>{
    const x = pad + i*(W-2*pad)/(series.length-1);
    const y = H-pad - (v-min)*(H-2*pad)/range;
    return x.toFixed(1)+','+y.toFixed(1);
  });
  const last = pts[pts.length-1].split(',');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs><linearGradient id="sparkfill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(77,163,255,.35)"/><stop offset="100%" stop-color="rgba(77,163,255,0)"/>
    </linearGradient></defs>
    <polygon class="area" points="${pad},${H-pad} ${pts.join(' ')} ${W-pad},${H-pad}"/>
    <polyline points="${pts.join(' ')}"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="2.2" fill="#4da3ff"/>
  </svg>`;
}

/* ================================================================
   GRUPO — vista para las tablets/celulares de cada familia
   ================================================================ */
const Grupo = {
  st:null, mounted:false,

  defaults(){
    return {
      id: 'g'+Math.random().toString(36).slice(2,8),
      joined:false, sessionCode:'', name:'', caseId:null,
      autonomous:false, round:1, step:'join',
      pf: Engine.newPortfolio(),
      confirmed:{}, draft:{}, lrmAsked:{}, lastAccrual:null
    };
  },

  mount(){
    if(!this.st){
      const saved = localStorage.getItem('bvm_grupo');
      this.st = saved ? JSON.parse(saved) : this.defaults();
    }
    if(this.st.scen) applyScenario(this.st.scen);
    if(this.st.joined && !this.st.autonomous && Sync.mode==='off'){
      Sync.connect(this.st.sessionCode, 'group', {onState: s=>this.onState(s)});
    }
    this.render();
  },

  save(){ localStorage.setItem('bvm_grupo', JSON.stringify(this.st)); },

  reset(){
    if(!confirm('¿Reiniciar el juego de este grupo? Se pierde el portafolio actual.')) return;
    localStorage.removeItem('bvm_grupo');
    this.st = this.defaults();
    this.render();
  },

  /* ---------- sync ---------- */
  join(autonomous){
    const name = document.getElementById('g-name').value.trim();
    if(!name){ alert('Escribí el nombre de tu familia.'); return; }
    this.st.name = name;
    this.st.autonomous = autonomous;
    this.st.joined = true;
    if(!autonomous){
      const code = (document.getElementById('g-code').value.trim()||'BVM1').toUpperCase();
      this.st.sessionCode = code;
      localStorage.setItem('bvm_code', code);
      Sync.connect(code, 'group', {onState: s=>this.onState(s)});
    }
    this.st.step = 'case';
    this.save(); this.render();
  },

  onState(state){
    if(!this.st || !this.st.joined) return;
    this.coordState = state;
    if(state && state.scen && state.scen !== this.st.scen){
      this.st.scen = applyScenario(state.scen); this.save();
    }
    if(!state || state.phase==='lobby'){ this.render(); return; }
    if(state.round > this.st.round){
      this.advanceTo(state.round);
    } else if(state.round === this.st.round && this.st.step==='wait' && !this.st.confirmed[this.st.round] && this.st.caseId){
      this.st.step = this.st.round>=GAME_DATA.rounds ? 'final' : 'trade';
      this.save(); this.render();
    } else {
      this.render();
    }
  },

  publicGroup(){
    const st = this.st;
    const value = Engine.value(st.pf, st.round);
    const invested = 1 - (st.pf.cash / Math.max(value,1));
    const sc = Score.compute(st.pf, this.caseOf(), st.round);
    return {
      id: st.id, name: st.name, caseId: st.caseId, round: st.round,
      value: Math.round(value), invested: Math.round(invested*100),
      score: Math.round(sc.total*10)/10, neff: Math.round(sc.neff*10)/10,
      parts: {meta:Math.round(sc.meta), div:Math.round(sc.div),
              perfil:Math.round(sc.perfil), disc:Math.round(sc.disc), bonus:Math.round(sc.bonus)},
      done: !!st.confirmed[st.round], ts: Date.now()
    };
  },
  broadcast(){ if(!this.st.autonomous && Sync.mode!=='off') Sync.sendGroup(this.publicGroup()); },

  /* Cierre en modo autónomo: la letra define los precios finales */
  cerrar(letra){
    this.st.scen = applyScenario(letra);
    this.save();
    this.advanceTo(3);
  },

  /* ---------- rondas ---------- */
  advanceTo(r){
    const st = this.st;
    while(st.round < r){
      st.lastAccrual = Engine.accrue(st.pf);
      st.round++;
    }
    st.draft = {};
    st.step = (st.round>=GAME_DATA.rounds) ? 'final' : 'results';
    ringBell('¡SUENA LA CAMPANA!  RONDA '+st.round, ROUND_SUBS[st.round]||'');
    this.save(); this.broadcast(); this.render();
  },

  pickCase(id){
    this.st.caseId = id;
    this.st.step = 'briefing';
    this.save(); this.broadcast(); this.render();
  },

  empezar(){
    // en modo sincronizado espera a que el coordinador abra el mercado
    const open = this.st.autonomous || (this.coordState && this.coordState.phase==='play');
    this.st.step = open ? 'trade' : 'wait';
    this.save(); this.broadcast(); this.render();
  },

  /* ---------- órdenes ---------- */
  setDelta(id, v){
    const st = this.st;
    let d = parseInt(v,10); if(isNaN(d)) d = 0;
    const owned = st.pf.holdings[id]||0;
    if(d < -owned) d = -owned;                       // no vender lo que no se tiene
    st.draft[id] = d;
    if(this.draftCash() < 0){                        // no gastar más del efectivo
      const px = Engine.price(id, st.round) * (1 + GAME_DATA.fee);
      let guard = 0;
      while(this.draftCash() < 0 && guard++ < 999){
        d -= Math.max(1, Math.ceil((-this.draftCash())/px));
        if(d < -owned){ d = -owned; st.draft[id] = d; break; }
        st.draft[id] = d;
      }
    }
    this.save(); this.renderTradeNumbers();
  },
  bump(id, dir){ this.setDelta(id, (this.st.draft[id]||0)+dir); },

  draftCost(){
    let c = 0;
    for(const [id,d] of Object.entries(this.st.draft)){
      const px = Engine.price(id, this.st.round);
      c += d * px + Engine.fee(d, px);
    }
    return c;
  },
  draftFees(){
    let f = 0;
    for(const [id,d] of Object.entries(this.st.draft)) f += Engine.fee(d, Engine.price(id, this.st.round));
    return f;
  },
  draftCash(){ return this.st.pf.cash - this.draftCost(); },

  confirmTrades(){
    const st = this.st;
    for(const [id,d] of Object.entries(st.draft)){
      if(d) Engine.trade(st.pf, id, d, st.round);
    }
    st.draft = {};
    st.confirmed[st.round] = true;
    st.step = 'lrm';
    this.save(); this.broadcast(); this.render();
  },

  answerLRM(yes){
    const st = this.st;
    if(yes) Engine.placeLRM(st.pf, st.pf.cash);
    st.lrmAsked[st.round] = true;
    Score.record(st.pf, st.round);   // foto de la composición: cuenta para el puntaje
    st.step = 'wait';
    this.save(); this.broadcast(); this.render();
  },

  /* ---------- render ---------- */
  caseOf(){ return GAME_DATA.cases.find(c=>c.id===this.st.caseId); },

  goalStatus(value){
    const c = this.caseOf(); if(!c) return null;
    const target = GAME_DATA.budget * (1 + c.goalPct);
    if(value >= target) return {cls:'goal-ok', txt: c.goalPct>0 ? '✔ Meta alcanzada' : '✔ Capital protegido'};
    if(value >= GAME_DATA.budget) return {cls:'goal-mid', txt:'● En camino — todavía no llegan a la meta'};
    return {cls:'goal-no', txt:'✘ Por debajo del capital inicial'};

  topbar(){
    const st = this.st;

      <button class="btn mute-btn" title="Silenciar la campana" style="float:right;margin-left:8px"
              onclick="Campana.toggle()">🔔</button>
      <span class="brand">BOLSA <span class="tick"><svg class="ingot" viewBox="0 0 24 20" aria-hidden="true"><path d="M2.5 17.5h19" stroke="#7a6420" stroke-width="1.2" stroke-linecap="round"/><path d="M2.5 17.5v-15" stroke="#7a6420" stroke-width="1.2" stroke-linecap="round"/><path d="M4.5 14.5 9 9.5l3.5 3L20 4.5" fill="none" stroke="#E0A81C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M14.6 4.5H20v5.4" fill="none" stroke="#FFDF7A" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></svg></span> ${st.name?('· '+st.name):''}</span>

      <div class="card" style="text-align:center">
