        <p class="mono" style="font-size:36px;font-weight:800;margin:8px 0">${Engine.fmtUSD(cash)}</p>
        <p style="font-size:15px;line-height:1.55;margin:10px 0 18px">El Banco Central del Uruguay ofrece
          <b>Letras de Regulación Monetaria (LRM)</b>: le prestás tu dinero al BCU por un año y te paga
          <b class="gold">${(GAME_DATA.lrmRate*100).toFixed(0)}% de interés</b>. Es en pesos uruguayos
          — en este juego suponemos que el dólar se mantiene estable.</p>
        <div style="display:flex;gap:10px;flex-direction:column">
          <button class="btn btn-gold btn-big" onclick="Grupo.answerLRM(true)" ${cash<1?'disabled':''}>Sí, colocar el sobrante en Letras</button>
          <button class="btn btn-ghost" onclick="Grupo.answerLRM(false)">No, lo dejamos en efectivo (no gana interés)</button>
        </div>
      </div>
    </div>`;
  },

  rWait(){
    const st = this.st;
    const waitingOpen = !st.confirmed[st.round];
    const nextR = st.round + 1;
    return `<div class="waiting">
      <div class="pulse">${waitingOpen?'⏳':'🔔'}</div>
      <h2>${waitingOpen ? 'Esperando que el coordinador abra el mercado…'
                        : '¡Órdenes confirmadas!'}</h2>
      <p>${waitingOpen ? 'Mientras tanto, miren el monitor de precios y conversen la estrategia.'
                       : 'Cuando suene la campana, verán qué pasó con sus inversiones.'}</p>
      ${this.rMiniPortfolio()}
      ${st.autonomous && st.confirmed[st.round] ? (nextR===3 ? `
        <div class="card" style="max-width:420px;width:100%">
          <p style="font-size:14.5px;line-height:1.55;margin-bottom:12px">🔔 Cuando el coordinador anuncie
            la <b>Ronda 3</b> va a decir también una <b>letra</b>. Toquen esa letra:</p>
          <div style="display:flex;gap:8px">
            ${Object.keys(GAME_DATA.scenarios).map(k=>`
              <button class="btn btn-gold btn-big" style="flex:1" onclick="Grupo.cerrar('${k}')">${k}</button>`).join('')}
          </div>
        </div>` : `
        <button class="btn btn-primary btn-big" onclick="Grupo.advanceTo(${nextR})">
          🔔 El coordinador anunció la Ronda ${nextR}
        </button>`) : ''}
    </div>`;
  },

  rMiniPortfolio(){
    const st = this.st;
    const rows = Object.entries(st.pf.holdings).map(([id,q])=>{
      const a = Engine.assetById(id);
      return `<tr><td>${a.name}</td><td class="mono" style="text-align:right">${q}</td></tr>`;
    }).join('');
    if(!rows && !st.pf.lrm) return '';
    return `<div class="card" style="width:100%;max-width:420px;text-align:left">
      <h3 style="font-size:14px;color:var(--dim);margin-bottom:8px">SU PORTAFOLIO</h3>
      <table style="width:100%;font-size:14.5px;border-collapse:collapse">${rows}
        ${st.pf.lrm?`<tr><td>Letras (LRM)</td><td class="mono" style="text-align:right">${Engine.fmtUSD(st.pf.lrm)}</td></tr>`:''}
        <tr><td>Efectivo</td><td class="mono" style="text-align:right">${Engine.fmtUSD(st.pf.cash)}</td></tr>
      </table>
    </div>`;
  },

  rResults(){
    const st = this.st;
    const value = Engine.value(st.pf, st.round);
    const ret = (value - GAME_DATA.budget)/GAME_DATA.budget;
    const g = this.goalStatus(value);
    const acc = st.lastAccrual||{coupons:0,lrmInt:0};
    return `<div class="g-section">
      <div class="result-hero">
        <p style="color:var(--dim)">Su portafolio ahora vale</p>
        <div class="big mono">${Engine.fmtUSD(value)}</div>
        <div class="pct ${ret>=0?'up':'down'}">${Engine.pct(ret)} desde el inicio</div>
        ${g?`<div class="goal-badge ${g.cls}">${g.txt}</div>`:''}
      </div>
      <h2 class="sec">¿Qué pasó con cada activo?</h2>
      ${GAME_DATA.assets.map(a=>{
        const q = st.pf.holdings[a.id]||0;
        const p0 = a.prices[st.round-2], p1 = a.prices[st.round-1];
        const chg = (p1-p0)/p0;
        return `<div class="asset-row"><div class="r1">
          <span class="tag tag-${a.type==='bond'?'bond':a.type==='fund'?'fund':'stock'}">${a.typeLabel}</span>
          <span class="nm">${a.name}</span>
          <span class="px mono" style="font-size:15px">
            ${p0.toFixed(2).replace('.',',')} → ${p1.toFixed(2).replace('.',',')}
            <span class="chg ${chg>0?'up':chg<0?'down':'flat'}">${Engine.pct(chg)}</span>
          </span></div>
          ${q?`<p class="sub">Tienen ${q} → ${Engine.fmtUSD(q*p1)} ${chg<0?'😰':'🙂'}</p>`:''}
        </div>`;
      }).join('')}
      ${(acc.coupons||acc.lrmInt)?`<div class="lesson">💰 <b>Cobraron rentas:</b>
        ${acc.coupons?('cupones de bonos por <b>'+Engine.fmtUSD(acc.coupons)+'</b>. '):''}
        ${acc.lrmInt?('intereses de las Letras por <b>'+Engine.fmtUSD(acc.lrmInt)+'</b>. '):''}
        Ya están acreditados en su efectivo: pueden reinvertirlos.</div>`:''}
      <h2 class="sec">📰 Noticias del mercado</h2>
      ${renderNews(st.round, false)}
      ${this.rComentarioRonda()}
      <button class="btn btn-primary btn-big" style="width:100%;margin-top:14px" onclick="Grupo.st.step='trade';Grupo.save();Grupo.render()">
        ➜ Ir a operar (Ronda ${st.round})
      </button>
    </div>`;
  },

  /* Comentario derivado de lo que realmente pasó con los precios */
  rComentarioRonda(){
    const st = this.st;
    const chg = a => { const p0=a.prices[st.round-2], p1=a.prices[st.round-1]; return (p1-p0)/p0; };
    const acc = GAME_DATA.assets.filter(a=>a.type==='stock');
    const bon = GAME_DATA.assets.filter(a=>a.type==='bond');
    const prom = arr => arr.reduce((t,a)=>t+chg(a),0)/Math.max(arr.length,1);
    const pa = prom(acc), pb = prom(bon);
    let txt;
    if(pa < -0.10)
      txt = `📉 Las acciones cayeron en promedio <b>${Engine.pct(pa)}</b>: eso es la <b>volatilidad</b>.
             Los bonos se movieron ${Engine.pct(pb)} y además pagaron su cupón. Ahora decidan:
             ¿vender, aguantar o comprar barato?`;
    else if(pa > 0.10)
      txt = `📈 Las acciones subieron en promedio <b>${Engine.pct(pa)}</b>, mucho más que los bonos
             (${Engine.pct(pb)}). Más retorno vino con más riesgo: la próxima caída también va a ser mayor.`;
    else
      txt = `➡️ Ronda tranquila: las acciones se movieron ${Engine.pct(pa)} y los bonos ${Engine.pct(pb)}.
             Los que cobraron cupones e intereses ganaron igual, sin depender del precio.`;
    return `<div class="lesson">${txt}</div>`;
  },

  /* Panel de puntaje reutilizable */
  rScore(sc, c){
    const col = f => f>=0.8 ? 'linear-gradient(90deg,#12a35a,#22e07c)'
               : f>=0.45 ? 'linear-gradient(90deg,#c99a1e,#f5c542)'
               : 'linear-gradient(90deg,#a03030,#ff5d5d)';
    const bar = (ico, lbl, got, max, hint) => {
      const f = max>0 ? got/max : 0;
      return `<div class="sbar">
        <div class="sb-l"><span>${ico} ${lbl}</span><b>${got.toFixed(1).replace('.',',')} / ${max}</b></div>
        <div class="sb-t"><i style="width:${Math.round(Math.min(1,f)*100)}%;background:${col(f)}"></i></div>
        <p class="sb-h">${hint}</p></div>`;
    };
    const niv = Score.nivel(sc.total);
    return `<div class="card">
      <div class="score-hero">
        <div class="num" style="color:${niv.c}">${sc.total.toFixed(1).replace('.',',')}</div>
        <div class="den">puntos sobre 100${sc.bonus>0?' (+ bonus)':''}</div>
        <div class="niv" style="color:${niv.c}">${niv.t}</div>
      </div>
      ${bar('🎯','Meta cumplida', sc.meta, SCORE_W.meta,
            sc.rompioCapital ? 'La familia se comprometió a no perder capital y terminaron por debajo de USD 20.000.'
            : 'Meta de la familia: ' + Engine.pct(c?c.metaRet:0.18,0) + '. Ustedes lograron ' + Engine.pct(sc.ret) + '.')}
      ${bar('🧺','Diversificación', sc.div, SCORE_W.div,
            'Tuvieron el equivalente a ' + sc.neff.toFixed(1).replace('.',',') +
            ' posiciones distintas en promedio. Con 4 o más se obtiene el puntaje completo.')}
      ${bar('⚖️','Perfil de riesgo', sc.perfil, SCORE_W.perfil,
            'Esta familia necesitaba entre ' + Math.round(sc.band.min*100) + '% y ' + Math.round(sc.band.max*100) +
            '% en acciones y fondo. Terminaron con ' + Math.round(sc.riskShare*100) + '%.')}
      ${bar('🧠','Disciplina', sc.disc, SCORE_W.disc,
            (sc.loss>0 ? 'Vendieron con pérdida por ' + Engine.fmtUSD(sc.loss) + '. ' : 'No vendieron con pérdida. ') +
            'Efectivo quieto en promedio: ' + Math.round(sc.avgCash*100) + '%.')}
      ${sc.bonus>0 ? bar('⭐','Bonus por superar la meta', sc.bonus, SCORE_W.bonus,
            'Superar la meta suma poco a propósito: invertir es para llegar a un objetivo, no para ganarle al de al lado.') : ''}
    </div>`;
  },

  rFinal(){
    const st = this.st;
    const c = this.caseOf();
    const sc = Score.compute(st.pf, c, st.round);
    const code = Engine.resultCode(sc.value, sc.total, st.caseId);
    const fb = Score.feedback(sc, c);
    return `<div class="g-section">
      <div class="step-title" style="text-align:center">🏁 Resultado final — ${c?c.icon+' '+c.title:''}</div>
      ${this.rScore(sc, c)}

      <h2 class="sec">Qué dice su resultado</h2>
      ${fb.map(f=>`<div class="fb"><span class="ico">${f.ico}</span><span>${f.txt}</span></div>`).join('')}

      <h2 class="sec">El dinero</h2>
      <div class="result-hero">
        <p style="color:var(--dim)">Con ${Engine.fmtUSD(GAME_DATA.budget)} iniciales terminaron con</p>
        <div class="big mono ${sc.ret>=0?'up':'down'}">${Engine.fmtUSD(sc.value)}</div>
        <div class="pct ${sc.ret>=0?'up':'down'}">${Engine.pct(sc.ret)} en ${GAME_DATA.rounds} años</div>
      </div>
      ${this.rDonut()}

      <h2 class="sec">Para decirle al coordinador</h2>
      <div class="code-box">${code}</div>
      <p class="hint" style="text-align:center;margin-top:6px">Este código lleva su puntaje y su resultado.
        Si no hay conexión, el coordinador lo ingresa para armar el ranking.</p>

      <div class="lesson">🎓 <b>Lo que muestra el juego:</b> en la Ronda 2 cayeron todas las acciones,
        pero en la Ronda 3 <b>sólo algunas volvieron</b>. Una nunca se recuperó: quien había puesto
        todo ahí perdió la mitad de su dinero, y no por haber decidido mal, sino porque le tocó.
        El fondo se llevó la suba de la ganadora sin necesidad de adivinar cuál era, y los bonos
        pagaron sus intereses todos los años pasara lo que pasara.
        <b>Diversificar no es apostar a varias: es dejar de depender de acertar.</b></div>
      ${st.pf.fees?`<div class="lesson">🧾 Pagaron <b>${Engine.fmtUSD(st.pf.fees)}</b> en comisiones
        (${(GAME_DATA.fee*100).toFixed(0)}% de cada operación, al comprar y al vender). Se cobra cada vez:
        el que cambia de idea paga dos veces, una al deshacerse de lo que tenía y otra al comprar lo nuevo.
        Por eso el que opera todo el tiempo suele terminar peor que el que arma su cartera y la sostiene.</div>`:''}
      ${st.pf.coupons||st.pf.lrmInterest?`<div class="lesson">💰 En total cobraron
        <b>${Engine.fmtUSD(st.pf.coupons + st.pf.lrmInterest)}</b> en cupones e intereses — dinero que
        ganaron aunque los precios no subieran. Eso es el <b>interés</b> trabajando para ustedes.</div>`:''}
    </div>`;
  },

  rDonut(){
    const st = this.st;
    const parts = [];
    let bonds=0, funds=0, stocks=0;
    for(const [id,q] of Object.entries(st.pf.holdings)){
      const a = Engine.assetById(id);
      const v = q * Engine.price(id, st.round);
      if(a.type==='bond') bonds+=v; else if(a.type==='fund') funds+=v; else stocks+=v;
    }
    if(bonds) parts.push({n:'Bonos', v:bonds, c:'#4da3ff'});
    if(funds) parts.push({n:'Fondo', v:funds, c:'#9b7bff'});
    if(stocks) parts.push({n:'Acciones', v:stocks, c:'#f5c542'});
    if(st.pf.lrm) parts.push({n:'Letras', v:st.pf.lrm, c:'#22e07c'});
    if(st.pf.cash>0.5) parts.push({n:'Efectivo', v:st.pf.cash, c:'#5a6480'});
    if(!parts.length) return '';
    const total = parts.reduce((s,p)=>s+p.v,0);
    let angle = -90;
    const segs = parts.map(p=>{
      const sweep = p.v/total*360;
      const large = sweep>180?1:0;
      const r=42, cx=50, cy=50;
      const a0 = angle*Math.PI/180, a1 = (angle+sweep)*Math.PI/180;
      const x0=cx+r*Math.cos(a0), y0=cy+r*Math.sin(a0);
      const x1=cx+r*Math.cos(a1), y1=cy+r*Math.sin(a1);
      angle += sweep;
      if(sweep>=359.9) return `<circle cx="50" cy="50" r="42" fill="none" stroke="${p.c}" stroke-width="15"/>`;
      return `<path d="M ${x0.toFixed(1)} ${y0.toFixed(1)} A ${r} ${r} 0 ${large} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}"
              fill="none" stroke="${p.c}" stroke-width="15"/>`;
    }).join('');
    return `<div class="card"><h3 style="font-size:14px;color:var(--dim);margin-bottom:10px">COMPOSICIÓN FINAL</h3>
      <div class="donut-wrap">
        <svg width="130" height="130" viewBox="0 0 100 100">${segs}</svg>
        <div class="legend">${parts.map(p=>`<span><span class="sw" style="background:${p.c}"></span>
          ${p.n}: <b class="mono">${Math.round(p.v/total*100)}%</b> (${Engine.fmtUSD(p.v)})</span>`).join('')}</div>
      </div></div>`;
  }
};

/* ================================================================
   COORDINADOR — control de la sesión y de las rondas
   ================================================================ */
const Coord = {
  session:null, groups:{}, manual:[], connected:false,

  mount(){
    if(!this.session){
      const saved = localStorage.getItem('bvm_coord');
      if(saved){
        const s = JSON.parse(saved);
        this.session = s.session; this.groups = s.groups||{}; this.manual = s.manual||[];
        if(this.session && this.session.state && this.session.state.scen) applyScenario(this.session.state.scen);
      }
    }
    if(this.session && !this.connected) this._connect();
    this.render();
  },

  save(){
    localStorage.setItem('bvm_coord', JSON.stringify({session:this.session, groups:this.groups, manual:this.manual}));
  },

  _connect(){
    this.connected = true;
    Sync.connect(this.session.code, 'coord', {
      onGroup: g=>{ this.groups[g.id]=g; this.save(); this.render(); }
    });
    localStorage.setItem('bvm_code', this.session.code);
  },

  create(){
    const letters = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
    let code='';
    for(let i=0;i<4;i++) code += letters[Math.floor(Math.random()*letters.length)];
    this.session = {code, state:{round:0, phase:'lobby', scen:drawScenario()}};
    this.groups = {}; this.manual = [];
    this._connect();
    this.save(); this.render();
  },

  reset(){
    if(!confirm('¿Terminar esta sesión y empezar de cero?')) return;
    localStorage.removeItem('bvm_coord');
    this.session = null; this.groups = {}; this.manual = []; this.connected = false;
    this.render();
  },

  setRound(r){
    const phase = r>=GAME_DATA.rounds ? 'final' : 'play';
    const labels = {1:'¿Abrir la Ronda 1? Los grupos podrán comprar sus primeros activos.',
                    2:'¿Pasar a la Ronda 2? Los precios cambian (las acciones caen) y los grupos podrán vender y comprar.',
                    3:'¿Pasar a la Ronda 3? La recuperación es despareja: una acción vuelve con fuerza, otra queda igual y otra no se recupera. Los grupos podrán reacomodar su cartera.',
                    4:'¿Tocar la campana final? En la Ronda 4 los precios casi no se mueven: se cierra el mercado y se calculan los puntajes.'};
    if(!confirm(labels[r])) return;
    const scen = (this.session.state && this.session.state.scen) || drawScenario();
    applyScenario(scen);
    this.session.state = {round:r, phase, scen};
    Sync.sendState(this.session.state);
    ringBell('RONDA '+r+(r>=GAME_DATA.rounds?' — CIERRE':''), ROUND_SUBS[r]||'', 2200);
    this.save(); this.render();
  },

  addManual(){
    const name = document.getElementById('m-name').value.trim();
    const code = document.getElementById('m-code').value.trim();
    const r = Engine.decodeResult(code);
    if(!name){ alert('Escribí el nombre del grupo.'); return; }
    if(r===null){ alert('El código no es válido. Revisá que esté bien copiado (ej: 43F5VX-D).'); return; }
    this.manual.push({name, value:r.value, score:r.score, caseId:r.caseId});
    this.save(); this.render();
  },
  delManual(i){ this.manual.splice(i,1); this.save(); this.render(); },

  /* Qué salió sorteado para el cierre. Sólo lo ve el coordinador. */
  rEscenario(){
    const st = this.session.state;
    const roles = scenarioRoles();
    const nom = r => { const id = Object.keys(roles).find(k=>roles[k]===r);
                       const a = GAME_DATA.assets.find(x=>x.id===id); return a?a.name:'—'; };
    const oculto = st.round < 3;
    return `<div class="card" style="margin-bottom:16px">
      <div class="news-title">🎲 Escenario de cierre — sorteado: ${st.scen||'A'}</div>
      ${oculto ? `<p class="hint">El sorteo ya está hecho y guardado, pero conviene no mirarlo todavía:
          si lo sabés, se te nota en la cara. Se revela solo al tocar la campana final.
          <button class="btn btn-ghost" style="padding:4px 10px;font-size:12px;margin-left:6px"
                  onclick="Coord.spoiler=true;Coord.render()">Ver igual</button></p>`:''}
      ${(!oculto || this.spoiler) ? `<table style="width:100%;font-size:14px;line-height:1.7">
        <tr><td>📈 Se recupera con fuerza</td><td><b>${nom('W')}</b></td></tr>
        <tr><td>➡️ Vuelve al punto de partida</td><td><b>${nom('M')}</b></td></tr>
        <tr><td>📉 No se recupera nunca</td><td><b>${nom('L')}</b></td></tr>
      </table>
      <p class="hint" style="margin-top:8px">Los grupos que jueguen sin conexión tienen que tocar el botón
        <b>${st.scen||'A'}</b> cuando anuncies la ronda final, para que les salgan estos mismos precios.</p>`:''}
    </div>`;
  },

  ranking(){
    const rows = [
      ...Object.values(this.groups).map(g=>({name:g.name, value:g.value, caseId:g.caseId,
                                             score:g.score||0, parts:g.parts, src:'sync'})),
      ...this.manual.map(m=>({name:m.name, value:m.value, caseId:m.caseId,
                              score:m.score||0, src:'manual'}))
    ];
    // gana el puntaje; el valor sólo desempata
    rows.sort((a,b)=> (b.score - a.score) || (b.value - a.value));
    return rows;
  },

  caseIcon(id){ const c = GAME_DATA.cases.find(c=>c.id===id); return c?c.icon:'❔'; },

  render(){
    const el = document.getElementById('view-coord');
    if(!this.session){
      el.innerHTML = `
      <div class="topbar" style="margin:-16px -16px 16px"><span class="brand">BOLSA <span class="tick"><svg class="ingot" viewBox="0 0 24 20" aria-hidden="true"><path d="M2.5 17.5h19" stroke="#7a6420" stroke-width="1.2" stroke-linecap="round"/><path d="M2.5 17.5v-15" stroke="#7a6420" stroke-width="1.2" stroke-linecap="round"/><path d="M4.5 14.5 9 9.5l3.5 3L20 4.5" fill="none" stroke="#E0A81C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M14.6 4.5H20v5.4" fill="none" stroke="#FFDF7A" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></svg></span> · COORDINADOR</span>
        <span class="conn-pill"></span></div>
      <div style="max-width:520px;margin:40px auto;display:flex;flex-direction:column;gap:14px">
        <h1 style="font-size:28px">🎛️ Panel del coordinador</h1>
        <p class="hint">Creá una sesión para esta clase o feria. Los grupos entran con el código
          de 4 letras desde sus tablets o celulares, y el monitor de mercado se proyecta en la pantalla grande.
          Si no hay internet ni red, igual podés coordinar las rondas a viva voz y cargar los resultados con
          los códigos que muestra cada tablet al final.</p>
        <button class="btn btn-primary btn-big" onclick="Coord.create()">➕ Crear sesión nueva</button>
      </div>`;
      Sync._updatePills();
      return;
    }

    const st = this.session.state;
    const groups = Object.values(this.groups).sort((a,b)=>b.value-a.value);
    const phaseTxt = st.phase==='lobby' ? 'Sala de espera — los grupos se están uniendo'
                   : st.phase==='play' ? 'Ronda '+st.round+' en curso'
                   : 'Mercado cerrado — resultados finales';

    el.innerHTML = `
    <div class="topbar" style="margin:-16px -16px 16px">
      <span class="brand">BOLSA <span class="tick"><svg class="ingot" viewBox="0 0 24 20" aria-hidden="true"><path d="M2.5 17.5h19" stroke="#7a6420" stroke-width="1.2" stroke-linecap="round"/><path d="M2.5 17.5v-15" stroke="#7a6420" stroke-width="1.2" stroke-linecap="round"/><path d="M4.5 14.5 9 9.5l3.5 3L20 4.5" fill="none" stroke="#E0A81C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M14.6 4.5H20v5.4" fill="none" stroke="#FFDF7A" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></svg></span> · COORDINADOR</span>
      <span class="round-pill">${phaseTxt}</span>
      <span class="conn-pill"></span>
      <button class="btn btn-ghost" style="padding:6px 10px;font-size:12px" onclick="Coord.reset()">Terminar sesión</button>
    </div>
    <div class="coord-grid">
      <div class="coord-steps">
        <div class="card" style="text-align:center">
          <div class="hint">CÓDIGO DE SALA</div>
          <div class="session-code">${this.session.code}</div>
          <p class="hint" style="margin-top:6px">Los grupos entran en <b>${location.origin==='null'||location.protocol==='file:'?'la app':location.host+location.pathname.replace(/index\.html$/,'')}</b> → “Grupo / Familia” con este código.</p>
        </div>
        <div class="card coord-steps">
          <h2 class="sec" style="margin:0 0 4px">Control de rondas</h2>
          <button class="btn ${st.round===0?'btn-gold':''}" ${st.round>=1?'disabled':''} onclick="Coord.setRound(1)">🔔 1 · Abrir Ronda 1 — armar portafolios</button>
          <button class="btn ${st.round===1?'btn-gold':''}" ${st.round!==1?'disabled':''} onclick="Coord.setRound(2)">🔔 2 · Ronda 2 — caen las acciones</button>
          <button class="btn ${st.round===2?'btn-gold':''}" ${st.round!==2?'disabled':''} onclick="Coord.setRound(3)">🔔 3 · Ronda 3 — recuperación despareja</button>
          <button class="btn ${st.round===3?'btn-gold':''}" ${st.round!==3?'disabled':''} onclick="Coord.setRound(4)">🔔 4 · Campana final — cierre del mercado</button>
          <p class="hint">La campana cambia los precios en el monitor y en las tablets de todos los grupos conectados.
             Si un grupo juega sin conexión, anunciá el cambio de ronda a viva voz.</p>
          <button class="btn" onclick="window.open(location.pathname+'#monitor?sala='+Coord.session.code,'_blank')">📈 Abrir monitor de mercado</button>
        </div>
      </div>
      <div>
        ${st.phase==='final' ? this.rRanking() : ''}
        ${this.rEscenario()}
        ${st.round>=1 ? (st.round>=GAME_DATA.rounds ? `<details class="card" style="margin-bottom:16px">
          <summary style="cursor:pointer" class="news-title">📰 Noticias del cierre — tocá para desplegarlas</summary>
          <div style="margin-top:12px">${renderNews(st.round, true)}</div>
        </details>` : `<div class="card" style="margin-bottom:16px">
          <div class="news-title">📰 Noticias de la Ronda ${st.round} — para leer en voz alta</div>
          ${renderNews(st.round, true)}
        </div>`) : ''}
        <div class="card">
          <h2 class="sec" style="margin:0 0 10px">Grupos conectados (${groups.length})</h2>
          ${groups.length? `<table class="groups-table"><tr>
              <th></th><th>Familia</th><th>Ronda</th><th>Divers.</th><th>Valor</th><th>Puntaje</th><th>Meta</th></tr>
            ${groups.map(g=>{
              const ret = g.value/GAME_DATA.budget - 1;
              const c = GAME_DATA.cases.find(c=>c.id===g.caseId);
              const target = GAME_DATA.budget*(1+(c?c.goalPct:0));
              const sem = g.value>=target?'g':g.value>=GAME_DATA.budget?'y':'r';
              return `<tr>
                <td>${this.caseIcon(g.caseId)}</td>
                <td><b>${g.name}</b> ${g.done?'✔':'<span style="color:var(--faint)">operando…</span>'}</td>
                <td class="mono">${g.round}</td>
                <td class="mono" style="color:${(g.neff||1)>=4?'var(--up)':(g.neff||1)>=2.5?'var(--gold)':'var(--down)'}">${(g.neff||1).toFixed(1).replace('.',',')}</td>
                <td class="mono">${Engine.fmtUSD(g.value)} <span class="chg ${ret>=0?'up':'down'}" style="font-size:12px">${Engine.pct(ret)}</span></td>
                <td class="mono" style="font-weight:800;color:var(--gold)">${g.score!==undefined?g.score.toFixed(1).replace('.',','):'—'}</td>
                <td><span class="sem ${sem}"></span></td>
              </tr>`;}).join('')}
          </table>`
          : `<p class="hint">Todavía no entró ningún grupo. En modo local (misma PC) abrí las pestañas de grupo
             en este navegador; en modo online los grupos entran desde sus dispositivos con el código.</p>`}
        </div>

        <div class="card" style="margin-top:16px">
          <h2 class="sec" style="margin:0 0 8px">Cargar resultado sin conexión</h2>
          <p class="hint" style="margin-bottom:10px">Al final del juego, cada tablet muestra un código
            (ej: <b class="mono">43F5VX-D</b>). Cargalo acá para sumar al grupo al ranking.</p>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <input class="input" id="m-name" placeholder="Nombre del grupo" style="flex:2;min-width:140px">
            <input class="input mono" id="m-code" placeholder="CÓDIGO" style="flex:1;min-width:110px;text-transform:uppercase">
            <button class="btn btn-primary" onclick="Coord.addManual()">Agregar</button>
          </div>
          ${this.manual.length?`<table class="groups-table" style="margin-top:10px">
            ${this.manual.map((m,i)=>`<tr><td>${this.caseIcon(m.caseId)}</td><td><b>${m.name}</b></td>
              <td class="mono">${Engine.fmtUSD(m.value)}</td>
              <td class="mono" style="font-weight:800;color:var(--gold)">${m.score!==undefined?m.score:'—'} pts</td>
              <td style="text-align:right"><button class="btn btn-ghost" style="padding:4px 10px;font-size:12px" onclick="Coord.delManual(${i})">✕</button></td></tr>`).join('')}
          </table>`:''}
        </div>
      </div>
    </div>`;
    Sync._updatePills();
  },

  rRanking(){
    const rows = this.ranking();
    if(!rows.length) return '';
    const medal = ['🥇','🥈','🥉'];
    const podium = rows.slice(0,3);
    const order = podium.length===3 ? [1,0,2] : podium.length===2 ? [1,0] : [0];
    const partsTxt = p => p ? `M ${p.meta} · D ${p.div} · P ${p.perfil} · Di ${p.disc}` : '';
    return `<div class="card" style="margin-top:16px">
      <h2 class="sec" style="margin:0 0 4px">🏆 Ranking final — por puntaje</h2>
      <div class="podium">
        ${order.map(i=>{
          const r = podium[i]; if(!r) return '';
          const ret = r.value/GAME_DATA.budget-1;
          return `<div class="pod p${i+1}">
            <div class="medal">${medal[i]}</div>
            <div class="nm">${this.caseIcon(r.caseId)} ${r.name}</div>
            <div class="sc">${r.score.toFixed(1).replace('.',',')}</div>
            <div class="vl">${Engine.fmtUSD(r.value)}<br><span class="${ret>=0?'up':'down'}">${Engine.pct(ret)}</span></div>
          </div>`;}).join('')}
      </div>
      <table class="groups-table">
        <tr><th></th><th>Familia</th><th>Puntaje</th><th>Desglose</th><th>Valor</th><th>Retorno</th></tr>
        ${rows.map((r,i)=>{
          const ret = r.value/GAME_DATA.budget-1;
          return `<tr><td>${i+1}º</td>
            <td>${this.caseIcon(r.caseId)} <b>${r.name}</b></td>
            <td class="mono" style="font-weight:800;color:var(--gold)">${r.score.toFixed(1).replace('.',',')}</td>
            <td class="mono" style="font-size:12.5px;color:var(--dim)">${partsTxt(r.parts)}</td>
            <td class="mono">${Engine.fmtUSD(r.value)}</td>
            <td class="mono ${ret>=0?'up':'down'}">${Engine.pct(ret)}</td></tr>`;}).join('')}
      </table>
      <p class="hint" style="margin-top:10px"><b>M</b> meta (40) · <b>D</b> diversificación (30) ·
        <b>P</b> perfil de riesgo (20) · <b>Di</b> disciplina (10).</p>
      <div class="lesson" style="margin-top:12px">🎤 <b>Para el cierre:</b> mostrá la columna de retorno
        al lado de la del puntaje. Casi siempre hay un grupo que ganó más dinero pero quedó abajo en el
        ranking. Esa es la conversación: ¿ganaron por buenas decisiones o porque salió bien la apuesta?
        ¿Qué hubiera pasado si en la Ronda 3 las acciones seguían cayendo?</div>
    </div>`;
  }
};

/* ================================================================
   BOOT
   ================================================================ */
Campana.init();
sellarVersion();
route();
</script>
</body>
</html>
